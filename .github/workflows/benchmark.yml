name: benchmark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to benchmark with this branch's harness. Leave empty to benchmark the checked-out version.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Benchmark
        env:
          BENCH_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$BENCH_REF" ]; then
            npm run bench -- --ref "$BENCH_REF"
          else
            npm run bench
          fi
      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          cp -a bench/results "$snapshot/results"
          cp BENCHMARK.md "$snapshot/BENCHMARK.md"
          version="$(node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            const names = readdirSync("bench/results").filter((name) => name.endsWith(".json"));
            const files = names.map((name) => JSON.parse(readFileSync(`bench/results/${name}`, "utf8")));
            files.sort((a, b) => a.generatedAt.localeCompare(b.generatedAt));
            process.stdout.write(files.at(-1).version);
          ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard
          branch="bench/results-${version}"
          git checkout -B "$branch" origin/main
          mkdir -p bench
          rm -rf bench/results
          cp -a "$snapshot/results" bench/results
          cp "$snapshot/BENCHMARK.md" BENCHMARK.md
          git add bench/results BENCHMARK.md
          if git diff --cached --quiet; then
            echo "No benchmark changes."
            exit 0
          fi
          git commit -m "Record uninvent ${version} benchmark"
          git push --force-with-lease origin "HEAD:${branch}"
          existing="$(gh pr list --head "$branch" --base main --json number --jq "length")"
          if [ "$existing" != "0" ]; then
            echo "Pull request already open."
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Record uninvent ${version} benchmark" --body "Benchmark results for ${version}, generated by the release workflow. See BENCHMARK.md.

Detection numbers come from the fixed corpus. Latency is a median and can move slightly. No agent trial ran: this workflow does not set UNINVENT_BENCH_API_KEY."
