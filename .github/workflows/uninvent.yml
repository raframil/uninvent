name: uninvent

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: uninvent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Report design-system reuse
        uses: ./
        with:
          working-directory: examples/demo-app
          version: local
          fail-on-findings: false
          comment: true
